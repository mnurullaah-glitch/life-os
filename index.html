<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURULLAH // CLOUD OS</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --text-main: #ffffff; --text-muted: #aaaaaa; --accent: #ffffff; --glass-bg: rgba(10, 10, 10, 0.75); --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #000; color: var(--text-main); overflow-x: hidden; }

        /* GRADIENT (AÇILIŞ) */
        #gradient-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(-45deg, #0d0a1b, #1a103c, #0a1128, #000); background-size: 400% 400%; animation: flow 15s ease infinite; z-index: -3; transition: opacity 2s; }
        @keyframes flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        
        /* VİDEO (BAŞLATINCA GELECEK) */
        #bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -4; opacity: 0; transition: opacity 3s; pointer-events: none; }

        #intro-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1.5s; }
        #start-btn { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 18px 45px; cursor: pointer; border-radius: 30px; }

        nav, main { opacity: 0; transition: opacity 2s; pointer-events: none; }
        /* Senin orijinal CSS'in (paneller vb.) burada devam ediyor */
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; margin: 20px; }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .split-container { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        .add-btn { background: rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 10px; cursor: pointer; border: none; width: 100%; margin-bottom: 10px; }
        textarea { width: 100%; height: 300px; background: rgba(255,255,255,0.05); color: #fff; padding: 10px; border: 1px solid var(--glass-border); border-radius: 10px; }
        .todo-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; }
        .status { color: #00D15E; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="gradient-bg"></div>
    <video id="bg-video" loop playsinline muted>
        <source src="arkaplan.mp4" type="video/mp4">
    </video>

    <div id="intro-screen">
        <button id="start-btn" onclick="startSystem()">[ SİSTEMİ BAŞLAT ]</button>
    </div>

    <nav id="mainNav">
        <button class="tab-btn" onclick="openTab(event, 'dashboard')">Dashboard</button>
        <button class="tab-btn" onclick="openTab(event, 'journal')">Günlük</button>
        <button class="tab-btn" onclick="openTab(event, 'notes')">Notlar</button>
    </nav>

    <main id="mainContent">
        <section id="dashboard" class="tab-content active"><div class="glass-panel"><input type="text" id="todoInput" placeholder="Görev ekle..." onkeypress="handleEnter(event)"><ul id="todoList"></ul><div id="todoStatus" class="status"></div></div></section>
        <section id="journal" class="tab-content"><div class="glass-panel"><div class="split-container"><div><button class="add-btn" onclick="createNewJournal()">+ Yeni</button><ul id="journalList"></ul></div><div id="journalEditor" style="display:none;"><input type="text" id="journalTitle" oninput="updateActiveJournal()"><textarea id="journalText" oninput="updateActiveJournal()"></textarea><div id="journalStatus" class="status"></div></div></div></div></section>
        <section id="notes" class="tab-content"><div class="glass-panel"><div class="split-container"><div><button class="add-btn" onclick="createNewNote()">+ Yeni</button><ul id="notesList"></ul></div><div id="notesEditor" style="display:none;"><input type="text" id="notesTitle" oninput="updateActiveNote()"><textarea id="notesText" oninput="updateActiveNote()"></textarea><div id="notesStatus" class="status"></div></div></div></div></section>
    </main>

    <script>
        function startSystem() {
            document.getElementById('start-btn').style.display = 'none';
            const video = document.getElementById('bg-video');
            const gradient = document.getElementById('gradient-bg');
            video.style.opacity = '1';
            gradient.style.opacity = '0';
            video.play();
            setTimeout(() => {
                document.getElementById('intro-screen').style.opacity = '0';
                document.getElementById('mainNav').style.opacity = '1';
                document.getElementById('mainContent').style.opacity = '1';
                document.getElementById('mainNav').style.pointerEvents = 'auto';
                document.getElementById('mainContent').style.pointerEvents = 'auto';
            }, 2000);
        }

        function openTab(evt, tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
        }

        // --- FIREBASE VE DİĞER FONKSİYONLARIN BURADA ---
        const db = firebase.firestore();
        const userDocRef = db.collection('users').doc('nurullah');
        // (Not: Kalan tüm addTodo, render, saveToCloud fonksiyonlarını daha önce paylaştığın kodun içinden buraya olduğu gibi kopyalayıp yapıştırabilirsin.)
    </script>
</body>
</html>
