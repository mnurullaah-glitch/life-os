<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURULLAH // CLOUD OS</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #ffffff;
            --glass-bg: rgba(10, 10, 10, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #000; color: var(--text-main); overflow-x: hidden; }

        /* VİDEO ARKA PLAN */
        .video-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -2; filter: brightness(0.3) contrast(1.2);
            pointer-events: none;
        }

        /* İNTRO VE SİSTEMİ BAŞLAT EKRANI */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: transparent; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 1.5s; padding: 20px; text-align: center;
        }

        #start-btn {
            background: rgba(0, 0, 0, 0.5); color: white; border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px 40px; font-size: 1.2rem; letter-spacing: 5px; font-weight: 300; cursor: pointer;
            transition: 0.4s; backdrop-filter: blur(5px); border-radius: 5px;
        }
        #start-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: white; transform: scale(1.05); }

        .intro-text { font-size: 3.5rem; font-weight: 200; letter-spacing: 4px; opacity: 0; }
        .intro-sub { font-size: 2rem; color: var(--text-muted); margin-top: 15px; opacity: 0; }
        .intro-time { margin-top: 25px; color: #777; opacity: 0; font-size: 1.2rem;}
        
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* DASHBOARD ARAYÜZÜ (BAŞLANGIÇTA GİZLİ) */
        nav { display: flex; gap: 15px; justify-content: center; margin-top: 40px; opacity: 0; z-index: 10; position: relative; padding: 0 20px; }
        .tab-btn { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--glass-border); padding: 12px 25px; border-radius: 30px; font-size: 1rem; cursor: pointer; transition: 0.3s; backdrop-filter: blur(10px); }
        .tab-btn.active, .tab-btn:hover { background: rgba(255,255,255,0.2); color: white; }

        main { max-width: 1200px; margin: 40px auto; padding: 0 20px; opacity: 0; }
        .tab-content { display: none; animation: fadeIn 0.4s forwards; }
        .tab-content.active { display: block; }

        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        .panel-title { font-size: 1.2rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }

        /* ARŞİV DÜZENİ */
        .split-container { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        .sidebar-panel { display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--glass-border); padding-right: 15px; max-height: 500px; overflow-y: auto; }
        .editor-panel { display: flex; flex-direction: column; gap: 15px; }

        .add-btn { background: rgba(255,255,255,0.1); color: white; border: 1px dashed var(--glass-border); padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; text-align: center; width: 100%; margin-bottom: 10px; }
        .add-btn:hover { background: rgba(255,255,255,0.2); }

        .archive-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .archive-item { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); padding: 12px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .archive-item:hover, .archive-item.active { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.4); }
        .archive-item .title-text { font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 80%; }
        .archive-item .item-delete { color: #ff4444; background: none; border: none; cursor: pointer; opacity: 0.4; transition: 0.2s; }
        .archive-item:hover .item-delete { opacity: 1; }

        textarea, input[type="text"] { width: 100%; background: rgba(255, 255, 255, 0.02); color: white; border: 1px solid var(--glass-border); border-radius: 10px; padding: 15px; font-size: 1.1rem; outline: none; transition: 0.3s; }
        .title-input { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.5px; }
        textarea { height: 380px; resize: none; line-height: 1.6; }
        textarea:focus, input[type="text"]:focus { border-color: rgba(255,255,255,0.3); }
        .status { font-size: 0.85rem; color: #00D15E; margin-top: 10px; text-align: right; }

        /* TO-DO LIST */
        .todo-input-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { background: white; color: black; border: none; padding: 0 20px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .todo-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .todo-item label { display: flex; align-items: center; cursor: pointer; width: 100%; }
        .todo-item input[type="checkbox"] { appearance: none; width: 20px; height: 20px; border: 2px solid var(--text-muted); border-radius: 4px; margin-right: 15px; cursor: pointer; position: relative; flex-shrink: 0; }
        .todo-item input[type="checkbox"]:checked { background-color: var(--accent); border-color: var(--accent); }
        .todo-item input[type="checkbox"]:checked::after { content: '✓'; position: absolute; color: black; font-size: 12px; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; }
        .todo-item input[type="checkbox"]:checked + span { color: var(--text-muted); text-decoration: line-through; }
        .delete-btn { background: none; border: none; color: #ff4444; font-size: 1.2rem; cursor: pointer; opacity: 0.5; padding-left: 10px;}
        .todo-item:hover .delete-btn { opacity: 1; }

        /* MOBİL UYUM */
        @media (max-width: 768px) {
            .intro-text { font-size: 2.2rem; letter-spacing: 2px; }
            .intro-sub { font-size: 1.4rem; }
            nav { flex-wrap: wrap; gap: 10px; margin-top: 20px; }
            .tab-btn { flex: 1 1 calc(50% - 10px); padding: 10px; font-size: 0.9rem; text-align: center; }
            main { margin: 20px auto; padding: 0 15px; }
            .glass-panel { padding: 20px; margin-bottom: 20px; }
            .split-container { grid-template-columns: 1fr; }
            .sidebar-panel { border-right: none; border-bottom: 1px solid var(--glass-border); padding-right: 0; padding-bottom: 15px; max-height: 200px; }
            .todo-input-container { flex-direction: column; }
            .btn { padding: 15px; width: 100%; }
            #media .glass-panel { grid-template-columns: 1fr !important; }
            iframe { height: 220px; }
            textarea { height: 300px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <video id="bgVideo" class="video-bg" loop playsinline webkit-playsinline>
        <source src="arkaplan.mp4" type="video/mp4">
    </video>

    <div id="intro-screen">
        <button id="start-btn" onclick="startSystem()">[ SİSTEMİ BAŞLAT ]</button>
        <div class="intro-text" id="introText">MERHABA, NURULLAH.</div>
        <div class="intro-sub" id="dynamicGreeting">Sistem Başlatılıyor.</div>
        <div class="intro-time" id="introTime">00:00</div>
    </div>

    <nav id="mainNav">
        <button class="tab-btn active" onclick="openTab(event, 'dashboard')">Dashboard</button>
        <button class="tab-btn" onclick="openTab(event, 'journal')">Günlük</button>
        <button class="tab-btn" onclick="openTab(event, 'notes')">Notlar</button>
        <button class="tab-btn" onclick="openTab(event, 'media')">Medya</button>
    </nav>

    <main id="mainContent">
        <section id="dashboard" class="tab-content active">
            <div class="glass-panel">
                <div class="panel-title">Aksiyon Planı & To-Do</div>
                <div class="todo-input-container">
                    <input type="text" id="todoInput" placeholder="Görev ekle ve Enter'a bas..." onkeypress="handleEnter(event)">
                    <button class="btn" onclick="addTodo()">Ekle</button>
                </div>
                <ul id="todoList" style="list-style: none;"></ul>
                <div class="status" id="todoStatus">Sistem Bekleniyor...</div>
            </div>
        </section>

        <section id="journal" class="tab-content">
            <div class="glass-panel">
                <div class="panel-title">Kişisel Günlük Arşivi</div>
                <div class="split-container">
                    <div class="sidebar-panel">
                        <button class="add-btn" onclick="createNewJournal()">+ Yeni Günlük Sayfası</button>
                        <ul id="journalList" class="archive-list"></ul>
                    </div>
                    <div class="editor-panel" id="journalEditor" style="display:none;">
                        <input type="text" id="journalTitle" class="title-input" placeholder="Tarih / Başlık Yaz..." oninput="updateActiveJournal()">
                        <textarea id="journalText" placeholder="Bugün neler yaşandı?..." oninput="updateActiveJournal()"></textarea>
                        <div class="status" id="journalStatus">Bulut Senkronizasyonu Aktif ☁️</div>
                    </div>
                </div>
            </div>
        </section>

        <section id="notes" class="tab-content">
            <div class="glass-panel">
                <div class="panel-title">Fikirler & Gözlemler Deposu</div>
                <div class="split-container">
                    <div class="sidebar-panel">
                        <button class="add-btn" onclick="createNewNote()">+ Yeni Not Oluştur</button>
                        <ul id="notesList" class="archive-list"></ul>
                    </div>
                    <div class="editor-panel" id="notesEditor" style="display:none;">
                        <input type="text" id="notesTitle" class="title-input" placeholder="Not Başlığı Gir..." oninput="updateActiveNote()">
                        <textarea id="notesText" placeholder="Piyasa analizleri, yeni stratejiler veya fikirler..." oninput="updateActiveNote()"></textarea>
                        <div class="status" id="notesStatus">Bulut Senkronizasyonu Aktif ☁️</div>
                    </div>
                </div>
            </div>
        </section>

        <section id="media" class="tab-content">
            <div class="glass-panel" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <iframe height="300" src="https://www.youtube.com/embed/f3A81s8wKpw" style="border:none; width:100%; border-radius: 10px;"></iframe>
                <iframe height="300" src="https://open.spotify.com/embed/playlist/37i9dQZF1DWZeKCadgRdKQ?utm_source=generator&theme=0" style="border:none; width:100%; border-radius: 10px;"></iframe>
            </div>
        </section>
    </main>

    <script>
        // --- 1. SİNEMATİK AÇILIŞ SENARYOSU (JS İLE ZAMANLANMIŞ) ---
        window.onload = () => {
            const now = new Date();
            const hour = now.getHours();
            let greetingMsg = "İyi geceler.";
            if (hour >= 5 && hour < 12) greetingMsg = "Günaydın.";
            else if (hour >= 12 && hour < 18) greetingMsg = "İyi günler.";
            else if (hour >= 18 && hour < 22) greetingMsg = "İyi akşamlar.";

            document.getElementById('dynamicGreeting').textContent = greetingMsg;
            document.getElementById('introTime').textContent = `${String(hour).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        };

        function startSystem() {
            // 1. Butonu Gizle ve Videoyu Sesli Başlat
            document.getElementById('start-btn').style.display = 'none';
            const video = document.getElementById('bgVideo');
            video.volume = 0.6; // Ses seviyesi %60
            video.play();

            // 2. 4 Saniye Sonra İsim Yazısı
            setTimeout(() => { document.getElementById('introText').style.animation = 'fadeIn 2s forwards'; }, 4000);

            // 3. 5.5 Saniye Sonra Mesaj
            setTimeout(() => { document.getElementById('dynamicGreeting').style.animation = 'fadeIn 2s forwards'; }, 5500);

            // 4. 7 Saniye Sonra Saat
            setTimeout(() => { document.getElementById('introTime').style.animation = 'fadeIn 2s forwards'; }, 7000);

            // 5. 9.5 Saniye Sonra Sistemi Aç
            setTimeout(() => {
                document.getElementById('intro-screen').style.opacity = '0';
                document.getElementById('mainNav').style.animation = 'fadeIn 2s forwards';
                document.getElementById('mainContent').style.animation = 'fadeIn 2s forwards';
                
                setTimeout(() => { document.getElementById('intro-screen').style.display = 'none'; }, 1500);
            }, 9500);
        }

        function openTab(evt, tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        // --- 2. FIREBASE KONFİGÜRASYONU ---
        const firebaseConfig = {
            apiKey: "AIzaSyClvQeFzVSBNp8hRMz44GF8mxwhKq0XWHQ",
            authDomain: "dashboard-ab880.firebaseapp.com",
            projectId: "dashboard-ab880",
            storageBucket: "dashboard-ab880.firebasestorage.app",
            messagingSenderId: "1014186585487",
            appId: "1:1014186585487:web:fc3e7ebf4ad83bd3fd6ffa",
            measurementId: "G-8NSGQBPVBF"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const userDocRef = db.collection('users').doc('nurullah');

        let todos = [];
        let journals = [];
        let notes = [];
        let activeJournalId = null;
        let activeNoteId = null;

        // --- 3. BULUTTAN VERİ ÇEKME VE ESKİ VERİLERİ KURTARMA ---
        userDocRef.get().then((doc) => {
            if (doc.exists) {
                const data = doc.data();
                if(data.todos) { todos = data.todos; renderTodos(); }
                
                if(data.journals) { 
                    journals = data.journals; 
                } else if(data.journal && typeof data.journal === 'string' && data.journal.trim() !== "") {
                    journals = [{ id: "legacy-j", title: "Eski Sistemden Aktarılan Günlük", content: data.journal }];
                }
                renderJournalList();

                if(data.notes) { 
                    if(Array.isArray(data.notes)) {
                        notes = data.notes;
                    } else if(typeof data.notes === 'string' && data.notes.trim() !== "") {
                        notes = [{ id: "legacy-n", title: "Eski Sistemden Aktarılan Notlar", content: data.notes }];
                    }
                }
                renderNotesList();
            }
            document.getElementById('todoStatus').textContent = "Buluta Bağlı ☁️";
        }).catch(error => { console.log("Veri çekme hatası:", error); });

        // --- BULUTA KAYDETME ---
        let saveTimeout;
        function saveToCloud(field, value, statusId) {
            const statusEl = document.getElementById(statusId);
            statusEl.textContent = 'Kaydediliyor...';
            statusEl.style.color = 'white';

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                userDocRef.set({ [field]: value }, { merge: true })
                .then(() => {
                    statusEl.textContent = 'Senkronize Edildi ✓';
                    statusEl.style.color = '#00D15E';
                }).catch(() => {
                    statusEl.textContent = 'Hata: Veri gönderilemedi!';
                    statusEl.style.color = '#ff4444';
                });
            }, 800);
        }

        // --- 4. GÜNLÜK İŞLEMLERİ ---
        function renderJournalList() {
            const listEl = document.getElementById('journalList');
            listEl.innerHTML = '';
            journals.forEach(j => {
                const li = document.createElement('li');
                li.className = `archive-item ${j.id === activeJournalId ? 'active' : ''}`;
                li.onclick = (e) => { if(e.target.tagName !== 'BUTTON') selectJournal(j.id); };
                li.innerHTML = `
                    <span class="title-text">${j.title || 'Başlıksız Günlük'}</span>
                    <button class="item-delete" onclick="deleteJournal('${j.id}')">✕</button>
                `;
                listEl.appendChild(li);
            });
        }

        function createNewJournal() {
            const today = new Date().toLocaleDateString('tr-TR');
            const newJournal = { id: Date.now().toString(), title: today + " - Günlük", content: "" };
            journals.unshift(newJournal);
            activeJournalId = newJournal.id;
            renderJournalList();
            selectJournal(newJournal.id);
            saveToCloud('journals', journals, 'journalStatus');
        }

        function selectJournal(id) {
            activeJournalId = id;
            const journal = journals.find(j => j.id === id);
            if(journal) {
                document.getElementById('journalEditor').style.display = 'flex';
                document.getElementById('journalTitle').value = journal.title;
                document.getElementById('journalText').value = journal.content;
                renderJournalList();
            }
        }

        function updateActiveJournal() {
            const journal = journals.find(j => j.id === activeJournalId);
            if(journal) {
                journal.title = document.getElementById('journalTitle').value;
                journal.content = document.getElementById('journalText').value;
                saveToCloud('journals', journals, 'journalStatus');
                const activeItem = document.querySelector('#journalList .active .title-text');
                if(activeItem) activeItem.textContent = journal.title || 'Başlıksız Günlük';
            }
        }

        function deleteJournal(id) {
            journals = journals.filter(j => j.id !== id);
            if(activeJournalId === id) document.getElementById('journalEditor').style.display = 'none';
            renderJournalList();
            saveToCloud('journals', journals, 'journalStatus');
        }

        // --- 5. NOT İŞLEMLERİ ---
        function renderNotesList() {
            const listEl = document.getElementById('notesList');
            listEl.innerHTML = '';
            notes.forEach(n => {
                const li = document.createElement('li');
                li.className = `archive-item ${n.id === activeNoteId ? 'active' : ''}`;
                li.onclick = (e) => { if(e.target.tagName !== 'BUTTON') selectNote(n.id); };
                li.innerHTML = `
                    <span class="title-text">${n.title || 'Başlıksız Not'}</span>
                    <button class="item-delete" onclick="deleteNote('${n.id}')">✕</button>
                `;
                listEl.appendChild(li);
            });
        }

        function createNewNote() {
            const newNote = { id: Date.now().toString(), title: "Yeni Strateji / Fikir", content: "" };
            notes.unshift(newNote);
            activeNoteId = newNote.id;
            renderNotesList();
            selectNote(newNote.id);
            saveToCloud('notes', notes, 'notesStatus');
        }

        function selectNote(id) {
            activeNoteId = id;
            const note = notes.find(n => n.id === id);
            if(note) {
                document.getElementById('notesEditor').style.display = 'flex';
                document.getElementById('notesTitle').value = note.title;
                document.getElementById('notesText').value = note.content;
                renderNotesList();
            }
        }

        function updateActiveNote() {
            const note = notes.find(n => n.id === activeNoteId);
            if(note) {
                note.title = document.getElementById('notesTitle').value;
                note.content = document.getElementById('notesText').value;
                saveToCloud('notes', notes, 'notesStatus');
                const activeItem = document.querySelector('#notesList .active .title-text');
                if(activeItem) activeItem.textContent = note.title || 'Başlıksız Not';
            }
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            if(activeNoteId === id) document.getElementById('notesEditor').style.display = 'none';
            renderNotesList();
            saveToCloud('notes', notes, 'notesStatus');
        }

        // --- 6. TO-DO İŞLEMLERİ ---
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');

        function saveTodosToCloud() { saveToCloud('todos', todos, 'todoStatus'); renderTodos(); }
        function renderTodos() {
            todoList.innerHTML = '';
            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = 'todo-item';
                li.innerHTML = `
                    <label>
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${index})">
                        <span>${todo.text}</span>
                    </label>
                    <button class="delete-btn" onclick="deleteTodo(${index})">✕</button>
                `;
                todoList.appendChild(li);
            });
        }

        function addTodo() {
            const text = todoInput.value.trim();
            if (text !== '') { todos.push({ text: text, completed: false }); todoInput.value = ''; saveTodosToCloud(); }
        }
        function handleEnter(e) { if (e.key === 'Enter') addTodo(); }
        function toggleTodo(index) { todos[index].completed = !todos[index].completed; saveTodosToCloud(); }
        function deleteTodo(index) { todos.splice(index, 1); saveTodosToCloud(); }
    </script>
</body>
</html>
