<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURULLAH // CLOUD OS</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #ffffff;
            --glass-bg: rgba(10, 10, 10, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #000; color: var(--text-main); overflow-x: hidden; }

        /* YENİ: CSS İLE AKAN GRADIENT ARKA PLAN (VİDEOYA GEREK YOK) */
        .gradient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            /* Koyu mor, gece mavisi ve siyah tonlarında bir akış */
            background: linear-gradient(-45deg, #0d0a1b, #1a103c, #0a1128, #000000);
            background-size: 400% 400%;
            animation: flowGradient 15s ease infinite; /* 15 saniyede bir turu tamamlar ve başa döner */
            z-index: -2;
            pointer-events: none;
        }

        /* Arka plan renklerinin akış animasyonu */
        @keyframes flowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* SİNEMATİK AÇILIŞ VE BUTON EKRANI */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: transparent; /* Arka plan gözüksün diye şeffaf yapıldı */
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 1.5s, background-color 2s; padding: 20px; text-align: center;
        }

        #start-btn {
            background: rgba(255, 255, 255, 0.05); color: white; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px 45px; font-size: 1.2rem; letter-spacing: 6px; font-weight: 300; cursor: pointer;
            transition: 0.4s; backdrop-filter: blur(10px); border-radius: 30px; z-index: 10000;
        }
        #start-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: white; transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.1); }

        .intro-text { font-size: 3.5rem; font-weight: 200; letter-spacing: 4px; opacity: 0; display: none; }
        .intro-sub { font-size: 2rem; color: var(--text-muted); margin-top: 15px; opacity: 0; display: none; }
        .intro-time { margin-top: 25px; color: #777; opacity: 0; font-size: 1.2rem; display: none; }
        
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* ANA NAVİGASYON (BAŞLANGIÇTA GİZLİ) */
        nav {
            display: flex; gap: 15px; justify-content: center; margin-top: 40px;
            opacity: 0; z-index: 10; position: relative; padding: 0 20px; transition: opacity 2s;
        }
        .tab-btn {
            background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--glass-border);
            padding: 12px 25px; border-radius: 30px; font-size: 1rem; cursor: pointer; transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .tab-btn.active, .tab-btn:hover { background: rgba(255,255,255,0.2); color: white; }

        /* ANA İÇERİK PANELİ */
        main { max-width: 1200px; margin: 40px auto; padding: 0 20px; opacity: 0; transition: opacity 2s; }
        .tab-content { display: none; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px;
            margin-bottom: 30px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .panel-title { font-size: 1.2rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }

        /* ARŞİV SPLIT DÜZENİ */
        .split-container { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        .sidebar-panel { display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--glass-border); padding-right: 15px; max-height: 500px; overflow-y: auto; }
        .editor-panel { display: flex; flex-direction: column; gap: 15px; }

        .add-btn { background: rgba(255,255,255,0.1); color: white; border: 1px dashed var(--glass-border); padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; text-align: center; width: 100%; margin-bottom: 10px; }
        .add-btn:hover { background: rgba(255,255,255,0.2); }

        .archive-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .archive-item { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); padding: 12px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .archive-item:hover, .archive-item.active { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.4); }
        .archive-item .title-text { font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 80%; }
        .archive-item .item-delete { color: #ff4444; background: none; border: none; cursor: pointer; opacity: 0.4; transition: 0.2s; }
        .archive-item:hover .item-delete { opacity: 1; }

        textarea, input[type="text"] {
            width: 100%; background: rgba(255, 255, 255, 0.02); color: white;
            border: 1px solid var(--glass-border); border-radius: 10px; padding: 15px;
            font-size: 1.1rem; outline: none; transition: 0.3s;
        }
        .title-input { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.5px; }
        textarea { height: 380px; resize: none; line-height: 1.6; }
        textarea:focus, input[type="text"]:focus { border-color: rgba(255,255,255,0.3); }
        
        .status { font-size: 0.85rem; color: #00D15E; margin-top: 10px; text-align: right; }

        /* TO-DO LIST */
        .todo-input-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { background: white; color: black; border: none; padding: 0 20px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .todo-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .todo-item label { display: flex; align-items: center; cursor: pointer; width: 100%; }
        .todo-item input[type="checkbox"] { appearance: none; width: 20px; height: 20px; border: 2px solid var(--text-muted); border-radius: 4px; margin-right: 15px; cursor: pointer; position: relative; flex-shrink: 0; }
        .todo-item input[type="checkbox"]:checked { background-color: var(--accent); border-color: var(--accent); }
        .todo-item input[type="checkbox"]:checked::after { content: '✓'; position: absolute; color: black; font-size: 12px; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; }
        .todo-item input[type="checkbox"]:checked + span { color: var(--text-muted); text-decoration: line-through; }
        .delete-btn { background: none; border: none; color: #ff4444; font-size: 1.2rem; cursor: pointer; opacity: 0.5; padding-left: 10px;}
        .todo-item:hover .delete-btn { opacity: 1; }

        /* MOBİL UYUM */
        @media (max-width: 768px) {
            .intro-text { font-size: 2.2rem; letter-spacing: 2px; }
            .intro-sub { font-size: 1.4rem; }
            nav { flex-wrap: wrap; gap: 10px; margin-top: 20px; }
            .tab-btn { flex: 1 1 calc(50% - 10px); padding: 10px; font-size: 0.9rem; text-align: center; }
            main { margin: 20px auto; padding: 0 15px; }
            .glass-panel { padding: 20px; margin-bottom: 20px; }
            .split-container { grid-template-columns: 1fr; }
            .sidebar-panel { border-right: none; border-bottom: 1px solid var(--glass-border); padding-right: 0; padding-bottom: 15px; max-height: 200px; }
            .todo-input-container { flex-direction: column; }
            .btn { padding: 15px; width: 100%; }
            #media .glass-panel { grid-template-columns: 1fr !important; }
            iframe { height: 220px; }
            textarea { height: 300px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="gradient-bg"></div>

    <div id="intro-screen">
        <button id="start-btn" onclick="startSystem()">[ SİSTEMİ BAŞLAT ]</button>
        <div class="intro-text" id="introText">MERHABA, NURULLAH.</div>
        <div class="intro-sub" id="dynamicGreeting">Sistem Başlatılıyor.</div>
        <div class="intro-time" id="introTime">00:00</div>
    </div>

    <nav id="mainNav">
        <button class="tab-btn active" onclick="openTab(event, 'dashboard')">Dashboard</button>
        <button class="tab-btn" onclick="openTab(event, 'journal')">Günlük</button>
        <button class="tab-btn" onclick="openTab(event, 'notes')">Notlar</button>
        <button class="tab-btn" onclick="openTab(event, 'media')">Medya</button>
    </nav>

    <main id="mainContent">
        <section id="dashboard" class="tab-content active">
            <div class="glass-panel">
                <div class="panel-title">Aksiyon Planı & To-Do</div>
                <div class="todo-input-container">
                    <input type="text" id="todoInput" placeholder="Görev ekle ve Enter'a bas..." onkeypress="handleEnter(event)">
                    <button class="btn" onclick="addTodo()">Ekle</button>
                </div>
                <ul id="todoList" style="list-style: none;"></ul>
                <div class="status" id="todoStatus">Sistem Bekleniyor...</div>
            </div>
        </section>

        <section id="journal" class="tab-content">
            <div class="glass-panel">
                <div class="panel-title">Kişisel Günlük Arşivi</div>
                <div class="split-container">
                    <div class="sidebar-panel">
                        <button class="add-btn" onclick="createNewJournal()">+ Yeni Günlük Sayfası</button>
                        <ul id="journalList" class="archive-list"></ul>
                    </div>
                    <div class="editor-panel" id="journalEditor" style="display:none;">
                        <input type="text" id="journalTitle" class="title-input" placeholder="Tarih / Başlık Yaz..." oninput="updateActiveJournal()">
                        <textarea id="journalText" placeholder="Bugün neler yaşandı?..." oninput="updateActiveJournal()"></textarea>
                        <div class="status" id="journalStatus">Bulut Senkronizasyonu Aktif ☁️</div>
                    </div>
                </div>
            </div>
        </section>

        <section id="notes" class="tab-content">
            <div class="glass-panel">
                <div class="panel-title">Fikirler & Gözlemler Deposu</div>
                <div class="split-container">
